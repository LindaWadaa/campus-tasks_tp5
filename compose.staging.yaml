
services:
  api:
    image: ghcr.io/lindawadaa/campus-tasks:${IMAGE_TAG}
    ports: ["8090:8080"]
    env_file: [.env.staging]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file: [.env.staging]
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-staging:
